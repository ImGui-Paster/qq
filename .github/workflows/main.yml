name: Flutter Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Get dependencies
        run: flutter pub get

      - name: Verify Android toolchain configuration
        run: |
          test -f android/gradle/wrapper/gradle-wrapper.properties
          grep -q 'gradle-8.14-all.zip' android/gradle/wrapper/gradle-wrapper.properties
          grep -q 'com.android.application.*8.11.1' android/settings.gradle
          grep -q 'org.jetbrains.kotlin.android.*2.2.20' android/settings.gradle
          grep -q '^android.newDsl=false' android/gradle.properties
          grep -q '^android.builtInKotlin=false' android/gradle.properties
          grep -q 'compileSdk = 36' android/app/build.gradle

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  build-ios:
    name: Build iOS Archive
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Get dependencies
        run: flutter pub get

      - name: Verify iOS configuration
        run: |
          test -f ios/Flutter/Generated.xcconfig
          grep -q "platform :ios, '15.0'" ios/Podfile
          grep -q 'IPHONEOS_DEPLOYMENT_TARGET = 15.0' ios/Runner.xcodeproj/project.pbxproj

      - name: Install CocoaPods
        working-directory: ios
        run: pod install --repo-update

      - name: Build iOS Archive
        run: flutter build ipa --release --no-codesign

      - name: Upload iOS Archive
        uses: actions/upload-artifact@v4
        with:
          name: ios-archive
          path: build/ios/archive/Runner.xcarchive
          if-no-files-found: error
